name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Cleaning and schedule regression tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated helper tests
        run: |
          clang -fobjc-arc -fblocks -Wall -Wextra -Wno-unused-function -Wno-unused-parameter -framework Foundation tests/helper_tests.m -o /tmp/voidy-helper-tests
          /tmp/voidy-helper-tests

  build:
    needs: test
    name: ${{ matrix.scheme }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            theos: theos/theos
          - scheme: roothide
            theos: roothide/theos
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          version=$(grep '^Version:' control | cut -d' ' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" app/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" app/Resources/Info.plist

      - name: Install build tools
        run: |
          brew install ldid make dpkg xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos (${{ matrix.theos }})
        run: |
          git clone --quiet --depth 1 --recursive https://github.com/${{ matrix.theos }}.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} PACKAGE_VERSION=$VERSION THEOS_PLATFORM_DEB_COMPRESSION_TYPE=xz THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6

      - name: Rename & inspect package
        run: |
          mkdir -p out
          for deb in packages/*.deb; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            name="voidy_${VERSION}_${{ matrix.scheme }}_${arch}.deb"
            cp "$deb" "out/$name"
            ar t "out/$name"
            ar t "out/$name" | grep -qx 'control.tar.gz\|control.tar.xz' || { echo "control archive missing"; exit 1; }
            ar t "out/$name" | grep -qx 'data.tar.xz' || { echo "data archive is not xz"; exit 1; }
            dpkg-deb --info "out/$name"
            dpkg-deb --contents "out/$name"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: voidy-${{ matrix.scheme }}
          path: out/*.deb
          retention-days: 1

  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add artwork
        run: |
          cp .github/assets/icon.png dist/voidy-icon.png
          cp .github/assets/banner.png dist/voidy-banner.png

      - name: Write release notes
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## Voidy ${{ needs.build.outputs.version }}"
            echo
            echo "| File | Jailbreak |"
            echo "|---|---|"
            for f in dist/*.deb; do
              n=$(basename "$f")
              case "$n" in
                *roothide*) echo "| \`$n\` | roothide |" ;;
                *) echo "| \`$n\` | rootless |" ;;
              esac
            done
            echo
            echo "**Installation:** download the matching \`.deb\` below and open it with Sileo, Zebra or Filza."
            echo
            echo "Open Voidy after upgrading to synchronize app exclusions. If a saved schedule is inactive, save it again in Automatic cleaning."
            echo
            echo "### Changes"
            echo
            awk -v version="$RELEASE_VERSION" '$0 == "## " version { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Voidy ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            dist/*.deb
            dist/voidy-icon.png
            dist/voidy-banner.png
          overwrite_files: true
          make_latest: true
