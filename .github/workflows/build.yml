name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.scheme }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            theos: theos/theos
          - scheme: roothide
            theos: roothide/theos
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          base=$(grep '^Version:' control | cut -d' ' -f2)
          version="$base.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" app/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" app/Resources/Info.plist

      - name: Install build tools
        run: |
          brew install ldid make dpkg xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos (${{ matrix.theos }})
        run: |
          git clone --quiet --depth 1 --recursive https://github.com/${{ matrix.theos }}.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} PACKAGE_VERSION=$VERSION

      - name: Rename & inspect package
        run: |
          mkdir -p out
          for deb in packages/*.deb; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            name="purify_${VERSION}_${{ matrix.scheme }}_${arch}.deb"
            cp "$deb" "out/$name"
            dpkg-deb --info "out/$name"
            dpkg-deb --contents "out/$name"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: purify-${{ matrix.scheme }}
          path: out/*.deb

  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "## Purify ${{ needs.build.outputs.version }}"
            echo
            echo "| File | Jailbreak |"
            echo "|---|---|"
            for f in dist/*.deb; do
              n=$(basename "$f")
              case "$n" in
                *roothide*) echo "| \`$n\` | roothide |" ;;
                *) echo "| \`$n\` | rootless |" ;;
              esac
            done
            echo
            echo "**Installation:** open the matching \`.deb\` with Sileo, Zebra or Filza."
            echo
            if [ -n "$COMMIT_MESSAGE" ]; then
              echo "### Changes"
              echo
              echo "$COMMIT_MESSAGE"
            fi
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Purify ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*.deb
          make_latest: true

      - name: Translate notes of older releases to English
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            body=$(gh release view "$tag" --json body --jq .body)
            case "$body" in
              *"Installation: passende"*|*"| Datei |"*|*"### Änderungen"*) ;;
              *) continue ;;
            esac
            printf '%s\n' "$body" \
              | sed -e 's/| Datei | Jailbreak |/| File | Jailbreak |/' \
                    -e 's/^Installation: passende `.deb` mit Sileo, Zebra oder Filza installieren\./**Installation:** open the matching `.deb` with Sileo, Zebra or Filza./' \
                    -e 's/^### Änderungen/### Changes/' \
                    -e 's/| roothide (Dopamine roothide \/ Bootstrap) |/| roothide |/' \
                    -e 's/| rootless (Dopamine, palera1n rootless, …) |/| rootless |/' \
              > old.md
            gh release edit "$tag" --notes-file old.md
            echo "Updated $tag"
          done
